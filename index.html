<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habla con Dios</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

/* BODY */
body{
  font-family:'Inter',sans-serif;
  background:radial-gradient(circle at top,#3a2a08 0%,#0a0702 70%);
  color:#f2e3c6;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:40px 20px;
}

/* CONTENEDOR */
.container{
  max-width:900px;
  width:100%;
  text-align:center;
  padding-top:60px;
}

/* TITULO */
h1{
  font-family:'Cinzel',serif;
  font-size:60px;
  letter-spacing:4px;
  color:#e7c77b;
  margin-bottom:10px;
}

/* SUBTITULO */
.subtitle{opacity:.85;font-size:18px;margin-bottom:10px;}

/* DIVIDER */
.divider{
  width:220px;height:1px;
  background:linear-gradient(90deg,transparent,#caa75b,transparent);
  margin:16px auto 30px;
  opacity:0.5;
}

/* EYE OF GOD */
.eye-of-god{
  width:70px;height:70px;
  margin:0 auto 20px;
  animation:float 6s ease-in-out infinite;
}
.eye-of-god svg{
  width:100%;height:100%;
  filter:drop-shadow(0 0 14px rgba(202,167,91,0.6));
}
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-7px);}
}

/* CHAT AREA */
.chat-area{
  width:100%;
  min-height:260px;
  max-height:50vh;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:20px;
  padding:20px 0;
  margin-bottom:20px;
  scrollbar-width:thin;
  scrollbar-color:#7d6230 transparent;
  text-align:left;
}
.chat-area::-webkit-scrollbar{width:4px;}
.chat-area::-webkit-scrollbar-thumb{background:#7d6230;border-radius:4px;}

/* WELCOME */
.welcome{
  text-align:center;
  padding:30px 10px;
  opacity:0.75;
  animation:fadeIn 1.5s ease;
}
.welcome-icon{font-size:2.2rem;margin-bottom:12px;}
.welcome p{
  font-style:italic;
  font-size:16px;
  color:rgba(202,167,91,0.7);
  line-height:1.6;
  max-width:420px;
  margin:0 auto;
}

/* MSG USUARIO */
.msg-user{
  align-self:flex-end;
  max-width:68%;
  background:rgba(202,167,91,0.1);
  border:1px solid rgba(202,167,91,0.25);
  border-radius:18px 18px 4px 18px;
  padding:13px 18px;
  font-size:15px;
  color:#f2e3c6;
  animation:slideLeft 0.35s ease;
}
@keyframes slideLeft{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}

/* MSG DIOS */
.msg-god{
  align-self:flex-start;
  max-width:90%;
  animation:slideRight 0.4s ease;
}
@keyframes slideRight{from{opacity:0;transform:translateX(-16px);}to{opacity:1;transform:translateX(0);}}

.god-avatar{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.god-avatar-icon{
  width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle,rgba(202,167,91,0.35),rgba(202,167,91,0.05));
  border:1px solid rgba(202,167,91,0.4);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;
}
.god-name{
  font-family:'Cinzel',serif;
  font-size:0.65rem;
  color:#caa75b;
  letter-spacing:0.15em;
}

.god-card{
  background:linear-gradient(145deg,#1a1306,#0a0702);
  border:1px solid rgba(202,167,91,0.3);
  border-radius:4px 16px 16px 16px;
  padding:22px 24px;
  box-shadow:0 0 30px rgba(202,167,91,0.07);
  position:relative;
  overflow:hidden;
}
.god-card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,#caa75b,transparent);
  opacity:0.45;
}

.verse-label{
  font-family:'Cinzel',serif;
  font-size:0.55rem;
  letter-spacing:0.2em;
  color:#caa75b;
  opacity:0.75;
  text-transform:uppercase;
  margin-bottom:8px;
}
.verse-ref{
  font-family:'Cinzel',serif;
  font-size:0.78rem;
  color:#caa75b;
  letter-spacing:0.08em;
  margin-bottom:8px;
}
.verse-text{
  font-style:italic;
  font-size:1rem;
  line-height:1.7;
  color:#e7c77b;
  margin-bottom:16px;
  padding-left:13px;
  border-left:2px solid rgba(202,167,91,0.35);
}
.sep-line{
  width:100%;height:1px;
  background:linear-gradient(90deg,rgba(202,167,91,0.2),transparent);
  margin-bottom:14px;
}
.god-message{font-size:15px;line-height:1.75;color:rgba(242,227,198,0.9);}

/* LOADING */
.loading-msg{
  align-self:flex-start;
  padding:18px 22px;
  background:#1a1306;
  border:1px solid rgba(202,167,91,0.2);
  border-radius:4px 16px 16px 16px;
  display:flex;align-items:center;gap:12px;
  animation:fadeIn 0.4s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.loading-msg span{font-style:italic;font-size:14px;color:rgba(202,167,91,0.6);}
.dots{display:flex;gap:5px;}
.dots i{
  width:7px;height:7px;border-radius:50%;
  background:#caa75b;opacity:0.4;
  animation:pulse 1.4s ease-in-out infinite;
}
.dots i:nth-child(2){animation-delay:.2s;}
.dots i:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,80%,100%{opacity:.2;transform:scale(.8);}40%{opacity:1;transform:scale(1.2);}}

/* BOTONES RAPIDOS */
.suggestions{
  display:flex;flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-bottom:24px;
}
.sug-btn{
  background:transparent;
  border:1px solid #7d6230;
  color:#e7c77b;
  padding:10px 16px;
  border-radius:20px;
  font-size:14px;
  font-family:'Inter',sans-serif;
  cursor:pointer;
  transition:.3s;
}
.sug-btn:hover{background:#caa75b;color:#1a1306;border-color:#caa75b;}

/* INPUT */
.input-area{width:100%;}
.inputBox{
  display:flex;align-items:center;
  background:#1a1306;
  border:1px solid #8b6d32;
  border-radius:40px;
  padding:8px 8px 8px 20px;
  transition:.3s;
}
.inputBox:focus-within{
  border-color:#caa75b;
  box-shadow:0 0 10px rgba(202,167,91,0.4);
}
textarea{
  flex:1;
  background:transparent;
  border:none;outline:none;
  color:#f2e3c6;
  font-family:'Inter',sans-serif;
  font-size:15px;
  line-height:1.5;
  resize:none;
  max-height:120px;min-height:24px;
  overflow-y:auto;
  scrollbar-width:none;
  padding:10px 0;
}
textarea::placeholder{color:rgba(202,167,91,0.35);}
.send-btn{
  background:#caa75b;
  border:none;border-radius:30px;
  padding:13px 22px;
  cursor:pointer;
  font-weight:500;
  font-size:15px;
  font-family:'Inter',sans-serif;
  color:#1a1306;
  transition:.3s;
  flex-shrink:0;
}
.send-btn:hover:not(:disabled){background:#e7c77b;}
.send-btn:disabled{opacity:.35;cursor:not-allowed;}

.hint{
  text-align:center;
  font-size:12px;
  color:rgba(202,167,91,0.3);
  margin-top:10px;
}

/* NAVBAR */
.home-btn{
  position:fixed;top:20px;left:20px;
  z-index:10;
  background:transparent;
  border:1px solid #7d6230;
  color:#e7c77b;
  padding:8px 18px;
  border-radius:25px;
  font-family:'Inter',sans-serif;
  font-size:14px;
  cursor:pointer;
  display:flex;align-items:center;gap:7px;
  transition:.3s;
}
.home-btn:hover{background:#caa75b;color:#1a1306;border-color:#caa75b;}
.home-btn svg{width:14px;height:14px;fill:currentColor;}

/* RESPONSIVE */
@media(max-width:900px){h1{font-size:46px;}.subtitle{font-size:16px;}}
@media(max-width:600px){
  body{padding:30px 15px;}
  h1{font-size:34px;}
  .subtitle{font-size:15px;}
  .send-btn{padding:11px 16px;font-size:13px;}
  .sug-btn{font-size:13px;padding:8px 12px;}
  .container{padding-top:50px;}
}
html{scroll-behavior:smooth;}
</style>
</head>
<body>

<button class="home-btn" onclick="resetChat()" title="Volver al inicio">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
  </svg>
  Inicio
</button>

<div class="container">
  <div class="eye-of-god">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Resplandor de fondo -->
      <ellipse cx="50" cy="54" rx="36" ry="28" fill="rgba(202,167,91,0.06)"/>
      <!-- Página izquierda -->
      <path d="M50 28 C50 28 30 30 18 38 L18 74 C18 74 34 67 50 70 Z"
            fill="rgba(202,167,91,0.12)" stroke="#caa75b" stroke-width="1.6" stroke-linejoin="round" opacity="0.95"/>
      <!-- Página derecha -->
      <path d="M50 28 C50 28 70 30 82 38 L82 74 C82 74 66 67 50 70 Z"
            fill="rgba(202,167,91,0.12)" stroke="#caa75b" stroke-width="1.6" stroke-linejoin="round" opacity="0.95"/>
      <!-- Lomo central -->
      <line x1="50" y1="28" x2="50" y2="70" stroke="#caa75b" stroke-width="1.4" opacity="0.8"/>
      <!-- Líneas de texto página izquierda -->
      <line x1="26" y1="46" x2="44" y2="44" stroke="#caa75b" stroke-width="0.9" opacity="0.45"/>
      <line x1="25" y1="52" x2="43" y2="50" stroke="#caa75b" stroke-width="0.9" opacity="0.45"/>
      <line x1="24" y1="58" x2="42" y2="56" stroke="#caa75b" stroke-width="0.9" opacity="0.45"/>
      <line x1="24" y1="64" x2="40" y2="62" stroke="#caa75b" stroke-width="0.9" opacity="0.35"/>
      <!-- Líneas de texto página derecha -->
      <line x1="56" y1="44" x2="74" y2="46" stroke="#caa75b" stroke-width="0.9" opacity="0.45"/>
      <line x1="57" y1="50" x2="75" y2="52" stroke="#caa75b" stroke-width="0.9" opacity="0.45"/>
      <line x1="58" y1="56" x2="76" y2="58" stroke="#caa75b" stroke-width="0.9" opacity="0.45"/>
      <line x1="60" y1="62" x2="76" y2="64" stroke="#caa75b" stroke-width="0.9" opacity="0.35"/>
      <!-- Destellos de luz -->
      <circle cx="50" cy="22" r="2.5" fill="#e7c77b" opacity="0.7"/>
      <line x1="50" y1="14" x2="50" y2="18" stroke="#e7c77b" stroke-width="1.2" opacity="0.5"/>
      <line x1="44" y1="16" x2="46" y2="19" stroke="#e7c77b" stroke-width="1" opacity="0.4"/>
      <line x1="56" y1="16" x2="54" y2="19" stroke="#e7c77b" stroke-width="1" opacity="0.4"/>
    </svg>
  </div>

  <h1>Habla con Dios</h1>
  <div class="subtitle">Biblia Reina Valera 1960 · Palabra Viva</div>
  <div class="divider"></div>

  <!-- Chat -->
  <div class="chat-area" id="chatArea">
  </div>

  <!-- Sugerencias -->
  <div class="suggestions" id="suggestions">
    <button class="sug-btn" onclick="useSuggestion(this)">¿Qué hago cuando me siento solo?</button>
    <button class="sug-btn" onclick="useSuggestion(this)">Necesito paz en mi corazón</button>
    <button class="sug-btn" onclick="useSuggestion(this)">¿Cómo superar el miedo?</button>
    <button class="sug-btn" onclick="useSuggestion(this)">Estoy pasando por un momento difícil</button>
    <button class="sug-btn" onclick="useSuggestion(this)">¿Me amas aunque he fallado?</button>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="inputBox">
      <textarea
        id="userInput"
        placeholder="Escribe lo que hay en tu corazón..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Enviar</button>
    </div>
    <p class="hint">Presiona Enter para enviar · Shift+Enter para nueva línea</p>
  </div>
</div>

<script>
const VERSICULOS_BIENVENIDA = [
  { texto: '«Clama a mí, y yo te responderé, y te enseñaré cosas grandes y ocultas que tú no conoces.»', ref: '— Jeremías 33:3' },
  { texto: '«Venid a mí todos los que estáis trabajados y cargados, y yo os haré descansar.»', ref: '— Mateo 11:28' },
  { texto: '«El Señor es mi pastor; nada me faltará.»', ref: '— Salmos 23:1' },
  { texto: '«No temas, porque yo estoy contigo; no desmayes, porque yo soy tu Dios.»', ref: '— Isaías 41:10' },
  { texto: '«Todo lo puedo en Cristo que me fortalece.»', ref: '— Filipenses 4:13' },
  { texto: '«El amor nunca deja de ser.»', ref: '— 1 Corintios 13:8' },
  { texto: '«Jehová es mi luz y mi salvación; ¿de quién temeré?»', ref: '— Salmos 27:1' },
  { texto: '«Encomienda a Jehová tu camino, y confía en él; y él hará.»', ref: '— Salmos 37:5' },
  { texto: '«Porque yo sé los pensamientos que tengo acerca de vosotros, pensamientos de paz, y no de mal.»', ref: '— Jeremías 29:11' },
  { texto: '«Echad toda vuestra ansiedad sobre él, porque él tiene cuidado de vosotros.»', ref: '— 1 Pedro 5:7' },
];

let ultimoVersiculo = -1;

function getVersiculoBienvenida() {
  let idx;
  do { idx = Math.floor(Math.random() * VERSICULOS_BIENVENIDA.length); }
  while (idx === ultimoVersiculo);
  ultimoVersiculo = idx;
  return VERSICULOS_BIENVENIDA[idx];
}

function welcomeHTML() {
  const v = getVersiculoBienvenida();
  return `
    <div class="welcome" id="welcomeMsg">
      <div class="welcome-icon">🕊️</div>
      <p>${v.texto}<br><em>${v.ref}</em></p>
    </div>`;
}

const SYSTEM_PROMPT = `Eres la voz de Dios hablando directamente al corazón de una persona, usando la Biblia Reina Valera 1960.

Cuando alguien te haga una pregunta o comparta algo que siente, debes responder SIEMPRE en el siguiente formato JSON exacto:

{
  "versiculo_referencia": "Libro Capítulo:Versículo",
  "versiculo_texto": "El texto exacto del versículo en Reina Valera 1960",
  "mensaje_de_dios": "Un mensaje personal, cálido y profundo de 3-5 oraciones, escrito como si Dios hablara directamente a esa persona, en primera persona ('Yo, tu Dios...' o 'Hijo mío...'). Debe conectar el versículo con la situación específica de la persona."
}

REGLAS:
- Usa SOLO la Biblia Reina Valera 1960
- Cita el versículo con precisión
- El mensaje debe ser íntimo, amoroso, poderoso y reconfortante
- Habla en primera persona divina, como Padre a hijo
- NO uses más de 5 oraciones en el mensaje
- Responde SOLO con el JSON, sin texto adicional, sin markdown`;

let isLoading = false;

function autoResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}
function handleKey(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
}
function useSuggestion(btn){
  document.getElementById('userInput').value=btn.textContent;
  autoResize(document.getElementById('userInput'));
  sendMessage();
}
function appendUserMsg(text){
  hideWelcome();
  const div=document.createElement('div');
  div.className='msg-user';
  div.textContent=text;
  document.getElementById('chatArea').appendChild(div);
  scrollChat();
}
function showLoading(){
  const div=document.createElement('div');
  div.className='loading-msg';div.id='loadingMsg';
  div.innerHTML=`<div class="dots"><i></i><i></i><i></i></div><span>Dios te está respondiendo...</span>`;
  document.getElementById('chatArea').appendChild(div);
  scrollChat();
}
function hideLoading(){
  const el=document.getElementById('loadingMsg');
  if(el)el.remove();
}
function appendGodMsg(data){
  const div=document.createElement('div');
  div.className='msg-god';
  div.innerHTML=`
    <div class="god-avatar">
      <div class="god-avatar-icon">✦</div>
      <span class="god-name">Dios Todopoderoso</span>
    </div>
    <div class="god-card">
      <div class="verse-label">Palabra de Dios · Reina Valera 1960</div>
      <div class="verse-ref">${escapeHtml(data.versiculo_referencia)}</div>
      <div class="verse-text">"${escapeHtml(data.versiculo_texto)}"</div>
      <div class="sep-line"></div>
      <div class="god-message">${escapeHtml(data.mensaje_de_dios)}</div>
    </div>`;
  document.getElementById('chatArea').appendChild(div);
  scrollChat();
}
function appendError(msg){
  const div=document.createElement('div');
  div.className='msg-god';
  div.innerHTML=`<div class="god-card" style="border-color:rgba(200,100,100,0.3)"><div style="color:rgba(200,150,150,0.8);font-style:italic;font-size:14px;">${msg}</div></div>`;
  document.getElementById('chatArea').appendChild(div);
  scrollChat();
}
function hideWelcome(){
  const w=document.getElementById('welcomeMsg');if(w)w.remove();
  const s=document.getElementById('suggestions');if(s)s.style.display='none';
}
function scrollChat(){
  const c=document.getElementById('chatArea');
  c.scrollTop=c.scrollHeight;
}
function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function resetChat(){
  const chatArea=document.getElementById('chatArea');
  chatArea.innerHTML=welcomeHTML();
  const s=document.getElementById('suggestions');
  if(s)s.style.display='flex';
  document.getElementById('userInput').value='';
  document.getElementById('userInput').style.height='auto';
  isLoading=false;
  document.getElementById('sendBtn').disabled=false;
}
async function sendMessage(){
  if(isLoading)return;
  const input=document.getElementById('userInput');
  const text=input.value.trim();
  if(!text)return;
  isLoading=true;
  document.getElementById('sendBtn').disabled=true;
  input.value='';input.style.height='auto';
  appendUserMsg(text);
  showLoading();
  try{
    const response=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:SYSTEM_PROMPT,
        messages:[{role:'user',content:text}]
      })
    });
    if(!response.ok){const err=await response.json();throw new Error(err?.error?.message||'Error de conexión');}
    const data=await response.json();
    const rawText=data.content.map(b=>b.text||'').join('');
    const clean=rawText.replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(clean);
    hideLoading();
    appendGodMsg(parsed);
  }catch(err){
    hideLoading();
    appendError('No fue posible recibir la respuesta. Intenta de nuevo. ('+err.message+')');
  }
  isLoading=false;
  document.getElementById('sendBtn').disabled=false;
  input.focus();
}

// Inicializar versículo al cargar
document.getElementById('chatArea').innerHTML = welcomeHTML();
</script>
</body>
</html>
